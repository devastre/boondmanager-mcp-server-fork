# BoondManager MCP server — production-leaning compose example.
#
# Three authentication modes are available for the HTTP transport:
#
# MODE 1 — OAuth2 (default, no BOOND_HTTP_STATIC_AUTH / BOOND_HTTP_HYBRID_AUTH):
#   The MCP client performs the OAuth dance against BoondManager directly and
#   forwards `Authorization: Bearer <access_token>` on every request. The
#   server holds no secrets. Multi-tenant by construction.
#
# MODE 2 — Static auth (BOOND_HTTP_STATIC_AUTH=true, shown below):
#   The operator provides all credentials via env vars. No Bearer token is
#   needed from the MCP client. Suitable for CI/CD or single-tenant deployments.
#
# MODE 3 — Hybrid client/server auth (BOOND_HTTP_HYBRID_AUTH=true):
#   CLIENT_TOKEN and CLIENT_KEY stay on the server (env vars); the MCP client
#   supplies USER_TOKEN per request via the `X-Boond-User-Token` header. The
#   server mints the BoondManager JWT on the fly. Multi-tenant with per-user
#   audit trail, no OAuth dance required.
#
#   To use hybrid mode, replace the environment block below with:
#     BOOND_HTTP_HYBRID_AUTH: "true"
#     BOOND_CLIENT_TOKEN: "<your_client_token>"
#     BOOND_CLIENT_KEY: "<your_client_key>"
#     # Optional: limit JWT replay window
#     BOOND_JWT_TTL_SECONDS: "3600"
#
# Quick start (static auth, as configured below):
#   1. (Optional) cp .env.example .env  &  set MCP_HTTP_PUBLIC_URL if
#      you front this with a reverse proxy.
#   2. docker compose up -d
#   3. Connect your MCP client — no OAuth flow needed.
#
# Behind a reverse proxy (Traefik / Caddy / Nginx), add TLS upstream
# and set MCP_HTTP_PUBLIC_URL to the public HTTPS URL so the discovery
# metadata advertises the right resource identifier.

services:
  mcp:
    build: .
    # image: ghcr.io/fauguste/boondmanager-mcp-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3041:3041"
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: "${MCP_TRANSPORT}"
      MCP_HTTP_HOST: "${MCP_HTTP_HOST}"
      MCP_HTTP_PORT: "${MCP_HTTP_PORT}"
      MCP_HTTP_PATH: "${MCP_HTTP_PATH}"
      MCP_HTTP_STATEFUL: "${MCP_HTTP_STATEFUL}"
      BOOND_HTTP_HYBRID_AUTH: "${BOOND_HTTP_HYBRID_AUTH}"
      BOOND_CLIENT_TOKEN: "${BOOND_CLIENT_TOKEN}"
      BOOND_CLIENT_KEY: "${BOOND_CLIENT_KEY}"
      BOOND_MCP_READ_ONLY: "${BOOND_MCP_READ_ONLY}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.MCP_HTTP_PORT+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
